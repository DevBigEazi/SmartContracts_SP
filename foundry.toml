[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
electroneum = "https://rpc.electroneum.com"
electroneum-testnet = "https://rpc.ankr.com/electroneum_testnet"
avalanche-fuji = "https://api.avax-test.network/ext/bc/C/rpc"
avalanche = "https://api.avax.network/ext/bc/C/rpc"

[etherscan]
52014 = { key = "${ETHERSCAN_API_KEY:-empty}", url = "https://blockexplorer.electroneum.com/api" }
5201420 = { key = "${ETHERSCAN_API_KEY:-empty}", url = "https://testnet-blockexplorer.electroneum.com/api" }
43113 = { key = "${ETHERSCAN_API_KEY:-empty}", url = "https://api.routescan.io/v2/network/testnet/evm/43113/etherscan" }
43114 = { key = "${ETHERSCAN_API_KEY:-empty}", url = "https://api.routescan.io/v2/network/mainnet/evm/43114/etherscan" }
