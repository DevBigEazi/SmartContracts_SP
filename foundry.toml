[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
avalanche-fuji = "https://api.avax-test.network/ext/bc/C/rpc"
avalanche = "https://api.avax.network/ext/bc/C/rpc"

[etherscan]
43113 = { key = "${SNOWTRACE_API_KEY}", url = "https://api.routescan.io/v2/network/testnet/evm/43113/etherscan" }
43114 = { key = "${SNOWTRACE_API_KEY}", url = "https://api.routescan.io/v2/network/mainnet/evm/43114/etherscan" }


