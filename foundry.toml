[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
electroneum = "https://rpc.electroneum.com"
electroneum-testnet = "https://rpc.ankr.com/electroneum_testnet"

[etherscan]
52014 = { key = "${ETHERSCAN_API_KEY:-empty}", url = "https://blockexplorer.electroneum.com/api" }
5201420 = { key = "${ETHERSCAN_API_KEY:-empty}", url = "https://testnet-blockexplorer.electroneum.com/api" }
